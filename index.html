
<!DOCTYPE html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lomdim AI - המורה הפרטי שלך</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Rubik', 'sans-serif'],
            },
            colors: {
              primary: '#3B82F6',
              secondary: '#10B981',
              accent: '#8B5CF6',
            }
          }
        }
      }
    </script>
    <style>
      body {
        font-family: 'Rubik', sans-serif;
        background-color: #f3f4f6;
      }
      
      /* KaTeX RTL Optimizations */
      .katex { 
        font-size: 1.15em;
        direction: ltr; /* Math itself is always LTR */
        display: inline-block;
      }
      
      .katex-display {
        direction: ltr;
        margin: 1.5em 0;
        text-align: center;
        overflow-x: auto;
        overflow-y: hidden;
        padding: 0.5em 0;
      }

      /* Fix for inline math alignment in Hebrew text */
      .markdown-content .math-inline {
        margin: 0 0.2em;
        vertical-align: middle;
      }

      /* Flashcard 3D Effects */
      .perspective-1000 {
        perspective: 1000px;
      }
      .preserve-3d {
        transform-style: preserve-3d;
      }
      .backface-hidden {
        backface-visibility: hidden;
      }
      .rotate-y-180 {
        transform: rotateY(180deg);
      }
      .no-scrollbar::-webkit-scrollbar {
        display: none;
      }
      .no-scrollbar {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }

      /* RTL Bullet lists for react-markdown */
      .markdown-content ul {
        list-style-type: none;
        padding-right: 0;
      }
      .markdown-content li {
        position: relative;
        padding-right: 1.5rem;
      }
      .markdown-content li::before {
        content: "";
        position: absolute;
        right: 0;
        top: 0.75rem;
        width: 0.5rem;
        height: 0.5rem;
        background-color: rgba(59, 130, 246, 0.4);
        border-radius: 9999px;
      }

      /* Print Styles for PDF generation */
      @media print {
        body, html {
          background: white !important;
          height: auto !important;
          overflow: visible !important;
        }
        
        .no-print {
          display: none !important;
        }
        
        #root {
          display: block !important;
          height: auto !important;
          overflow: visible !important;
        }

        .summary-print-container {
          position: static !important;
          height: auto !important;
          max-height: none !important;
          overflow: visible !important;
          padding: 0 !important;
          margin: 0 !important;
          display: block !important;
          width: 100% !important;
          box-shadow: none !important;
          border: none !important;
        }

        #summary-to-print {
          padding: 1cm !important;
          height: auto !important;
          overflow: visible !important;
          display: block !important;
        }

        .markdown-content h1, 
        .markdown-content h2, 
        .markdown-content h3 {
          page-break-after: avoid;
        }
        
        .markdown-content p, 
        .markdown-content li {
          page-break-inside: avoid;
        }
      }
    </style>
    <script type="importmap">
    {
      "imports": {
        "@google/genai": "https://esm.sh/@google/genai@1.3.0",
        "recharts": "https://esm.sh/recharts@2.12.7",
        "lucide-react": "https://esm.sh/lucide-react@0.462.0",
        "katex": "https://esm.sh/katex@0.16.11",
        "react-markdown": "https://esm.sh/react-markdown@9.0.1",
        "remark-math": "https://esm.sh/remark-math@6.0.0",
        "rehype-katex": "https://esm.sh/rehype-katex@7.0.0",
        "rehype-raw": "https://esm.sh/rehype-raw@7.0.0",
        "react": "https://esm.sh/react@19.0.0",
        "react-dom": "https://esm.sh/react-dom@19.0.0",
        "react-dom/client": "https://esm.sh/react-dom@19.0.0/client",
        "react/": "https://esm.sh/react@19.0.0/",
        "react-dom/": "https://esm.sh/react-dom@19.0.0/"
      }
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="index.tsx"></script>
  </body>
</html>
